<!-- ================================================================
     EDITE AQUI: textos, fotos, data, vídeo e WhatsApp
     ----------------------------------------------------------------
     Troque só o que está entre aspas "...".
     Não apague as vírgulas no fim das linhas.
     ================================================================ -->
<script>
const CONFIG = {

  // 1) TELA DE ABERTURA
  intro: {
    frase: "Fiz isso especialmente pra você, meu amor ❤️",
    botao: "Clique aqui, meu amor ❤️"
  },

  // 2) DECLARAÇÃO SURPRESA
  declaracao: {
    titulo: "Uma declaração pra você",
    linhas: [
      "Existem pessoas que chegam e mudam o jeito como a gente enxerga os dias. Você é essa pessoa pra mim.",
      "Com você, até as coisas simples ficam mais bonitas: uma conversa, um sorriso, um silêncio gostoso.",
      "A distância pode separar nossos caminhos por um tempo, mas não muda o que eu sinto.",
      "Eu escolho você, hoje e em todos os dias que ainda vamos viver juntos."
    ],
    fecho: "Eu te amo, meu amor. ❤️"
  },

  // 3) NOSSA HISTÓRIA (linha do tempo)
  // "data" é opcional: deixe "" para não mostrar data.
  // "foto" é o nome do arquivo de imagem (fica ao lado do index.html).
  historia: {
    titulo: "Nossa história",
    subtitulo: "Cada capítulo ficou guardado com carinho",
    itens: [
      { data: "", titulo: "Como tudo começou",
        legenda: "Alguns começos parecem simples, mas carregam o início de algo enorme. O nosso foi assim.",
        foto: "foto-8.jpg" },
      { data: "", titulo: "Os primeiros momentos especiais",
        legenda: "Foi ali que percebi o quanto era bom estar perto de você e o quanto o tempo passava leve ao seu lado.",
        foto: "foto-1.jpg" },
      { data: "", titulo: "Lembranças que ficaram",
        legenda: "Risadas, conversas e pequenos detalhes que viraram memórias que eu guardo com muito carinho.",
        foto: "foto-3.jpg" },
      { data: "", titulo: "Hoje e sempre",
        legenda: "Mesmo de longe, seguimos escrevendo nossa história, e eu quero muitos capítulos ainda ao seu lado.",
        foto: "foto-6.jpg" }
    ]
  },

  // 4) GALERIA DE FOTOS
  // Para TROCAR uma foto: envie um arquivo novo com o MESMO nome (ex.: foto-3.jpg).
  // Para ADICIONAR: copie uma linha { src: "...", legenda: "" } e mude o nome.
  // Para REMOVER: apague a linha da foto.
  // "legenda" é opcional (pode ficar "").
  galeria: {
    titulo: "Nossos momentos",
    subtitulo: "Toque em uma foto para ampliar",
    fotos: [
      { src: "foto-1.jpg",  legenda: "" },
      { src: "foto-2.jpg",  legenda: "" },
      { src: "foto-3.jpg",  legenda: "" },
      { src: "foto-4.jpg",  legenda: "" },
      { src: "foto-5.jpg",  legenda: "" },
      { src: "foto-6.jpg",  legenda: "" },
      { src: "foto-7.jpg",  legenda: "" },
      { src: "foto-8.jpg",  legenda: "" },
      { src: "foto-9.jpg",  legenda: "" },
      { src: "foto-10.jpg", legenda: "" },
      { src: "foto-11.jpg", legenda: "" },
      { src: "foto-12.jpg", legenda: "" },
      { src: "foto-13.jpg", legenda: "" }
    ]
  },

  // 5) CARTA DE AMOR
  carta: {
    titulo: "Uma carta pra você",
    instrucao: "Toque no envelope para abrir",
    texto: "Meu amor, mesmo com você longe, queria encontrar um jeito de te lembrar o quanto você é importante pra mim. Cada lembrança nossa tem um lugar especial no meu coração. Sinto saudade dos nossos momentos, das nossas conversas, dos nossos sorrisos e de tudo aquilo que faz nossa história ser tão especial. Preparei isso pra você porque quero que sinta meu carinho mesmo de longe. Quero continuar construindo nossa história, vivendo momentos lindos ao seu lado e criando lembranças que vamos guardar para sempre. Eu te amo muito, minha princesa. ❤️"
  },

  // 6) CONTADOR DO NAMORO
  // Escreva a data de início assim: "AAAA-MM-DD"  (exemplo: "2024-03-15")
  // Se deixar vazio (""), aparece a mensagem romântica abaixo no lugar do contador.
  contador: {
    dataInicio: "",
    titulo: "Nosso tempo juntos",
    mensagemSemData: "O tempo que a gente tem juntos não cabe em números. Cada dia ao seu lado vale uma vida inteira de carinho. ❤️"
  },

  // 7) VÍDEO
  // Envie o vídeo para o mesmo lugar do index.html e escreva o nome aqui.
  // Exemplo: src: "video.mp4"
  // Enquanto "src" estiver vazio, a seção do vídeo fica escondida.
  video: {
    titulo: "Um vídeo pra você",
    subtitulo: "Aperte o play, meu amor",
    src: "",
    capa: ""   // opcional: nome de uma foto para aparecer antes do play. Ex.: "foto-1.jpg"
  },

  // 8) FINAL
  final: {
    frase: "Se a saudade apertar, volta aqui. Meu coração continua pertinho do seu. ❤️",
    botaoWhatsApp: "Mandar um beijinho no WhatsApp",
    botaoVoltar: "Ver tudo de novo",
    // Número que vai RECEBER a mensagem (o SEU), com país e DDD, só números.
    // Exemplo: "5531999999999". Se deixar vazio, o WhatsApp deixa ela escolher o contato.
    telefone: "",
    mensagemWhatsApp: "Oi, meu amor! ❤️ Vi o presente que você preparou pra mim e fiquei muito emocionada. Também estou com saudade de você."
  }
};
</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">

<style>
:root{
  --vinho-900:#2b0612; --vinho-800:#4a0d1f; --vinho-700:#6d1230; --vinho-600:#8c1a40;
  --rosa-100:#ffe4ea; --rosa-200:#ffc7d4; --rosa-300:#ff9db5; --rosa-400:#f77296; --rosa-500:#e8456f;
  --creme:#fff5ee; --ouro:#e8c28a;
  --display:"Playfair Display",Georgia,serif;
  --script:"Dancing Script","Segoe Script",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{
  background:linear-gradient(180deg,var(--vinho-900),var(--vinho-800) 50%,var(--vinho-900));
  background-attachment:fixed;
  color:var(--creme);font-family:var(--body);line-height:1.6;
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.cor{width:1em;height:1em;fill:currentColor;display:inline-block}

/* ---------- corações flutuando ---------- */
#coracoes{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.coracao{position:absolute;bottom:-50px;color:var(--rosa-400);opacity:0;animation:subir linear forwards;will-change:transform,opacity}
.coracao svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes subir{
  0%{transform:translateY(0) rotate(0) scale(.8);opacity:0}
  10%{opacity:var(--o,.5)}
  90%{opacity:var(--o,.5)}
  100%{transform:translateY(-115vh) rotate(25deg) scale(1.2);opacity:0}
}
main{position:relative;z-index:1}

/* ---------- animações gerais ---------- */
@keyframes batida{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
@keyframes entrar{from{opacity:0}to{opacity:1}}
@keyframes pular{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.batida{animation:batida 1.8s ease-in-out infinite}
.brilho{filter:drop-shadow(0 0 22px rgba(247,114,150,.65))}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s ease}
.reveal.visivel{opacity:1;transform:none}

/* ---------- abertura ---------- */
#intro{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;transition:opacity .6s ease,transform .6s ease;
}
#intro.saindo{opacity:0;transform:scale(1.05)}
#intro .grande{font-size:5rem;color:var(--rosa-500);margin-bottom:2rem}
#intro h1{
  font-family:var(--script);font-weight:600;font-size:clamp(2.6rem,11vw,4.6rem);line-height:1.15;
  color:var(--rosa-100);max-width:22ch;animation:entrar 1.4s ease both;
}
.botao{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:linear-gradient(90deg,var(--rosa-500),var(--vinho-600));color:var(--creme);
  font-family:var(--display);font-size:1.1rem;padding:16px 34px;border-radius:999px;text-decoration:none;
  box-shadow:0 10px 25px rgba(232,69,111,.3);outline:1px solid rgba(255,157,181,.4);
  transition:transform .2s ease;
}
.botao:active{transform:scale(.95)}
#intro .botao{margin-top:3rem}

/* ---------- seções ---------- */
.secao{max-width:980px;margin:0 auto;padding:80px 20px}
.titulo{text-align:center;margin-bottom:2.5rem}
.titulo svg.cor{font-size:1.5rem;color:var(--rosa-400);margin-bottom:.5rem}
.titulo h2{font-family:var(--script);font-weight:600;font-size:clamp(2.6rem,10vw,3.8rem);color:var(--rosa-200);line-height:1.15}
.titulo p{font-family:var(--display);font-style:italic;color:rgba(255,245,238,.7);margin-top:.6rem;font-size:1.05rem}

/* declaração */
#declaracao{
  max-width:680px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:80px 24px;
}
#declaracao .coracao-topo{font-size:3rem;color:var(--rosa-400)}
#declaracao h2{font-family:var(--script);font-weight:600;font-size:clamp(2.8rem,11vw,3.8rem);color:var(--rosa-200);margin-top:1.2rem;line-height:1.15}
#declaracao .linhas{margin-top:2.4rem;display:grid;gap:1.8rem}
#declaracao .linhas p{font-family:var(--display);font-size:clamp(1.2rem,4.6vw,1.5rem);line-height:1.6;color:rgba(255,245,238,.95)}
#declaracao .fecho{font-family:var(--script);font-weight:600;font-size:2.4rem;color:var(--ouro);margin-top:3rem}
.seta{margin-top:3rem;font-size:1.8rem;color:rgba(255,157,181,.7);animation:pular 2s ease-in-out infinite}

/* história */
.linha-tempo{list-style:none;max-width:720px;margin:0 auto;margin-left:auto;border-left:1px solid rgba(247,114,150,.4);padding-left:30px;position:relative;left:6px}
.linha-tempo li{position:relative;margin-bottom:3.5rem}
.linha-tempo li:last-child{margin-bottom:0}
.ponto{
  position:absolute;left:-41px;top:8px;width:21px;height:21px;border-radius:50%;
  background:var(--vinho-900);box-shadow:0 0 0 2px var(--rosa-400);display:flex;align-items:center;justify-content:center;color:var(--rosa-400);font-size:.75rem;
}
.cartao{overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.cartao img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 25%;background:var(--vinho-800)}
.cartao .texto{padding:20px}
.cartao .data{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ouro);margin-bottom:.2rem}
.cartao h3{font-family:var(--display);font-weight:500;font-size:1.5rem;color:var(--rosa-100)}
.cartao p.leg{margin-top:.5rem;color:rgba(255,245,238,.8)}

/* galeria (colunas, mostra a foto inteira sem cortar) */
.galeria{columns:2;column-gap:12px}
@media(min-width:700px){.galeria{columns:3;column-gap:16px}}
.galeria .reveal{break-inside:avoid;margin-bottom:12px}
@media(min-width:700px){.galeria .reveal{margin-bottom:16px}}
.foto{display:block;width:100%;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 25px rgba(0,0,0,.3);background:var(--vinho-800)}
.foto img{width:100%;height:auto;transition:transform .5s ease}
.foto:active img{transform:scale(1.05)}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#lightbox img{max-height:76vh;max-height:76dvh;width:auto;max-width:100%;object-fit:contain;border-radius:12px}
#lightbox .leg{margin-top:12px;font-family:var(--display);font-size:1.1rem;color:var(--rosa-100);text-align:center}
#lightbox .cont{margin-top:4px;font-size:.85rem;color:rgba(255,245,238,.6)}
.lb-btn{position:absolute;background:rgba(255,255,255,.12);color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.5rem}
#lbFechar{top:max(16px,env(safe-area-inset-top));right:16px}
#lbAnt{left:8px;top:50%;transform:translateY(-50%)}
#lbProx{right:8px;top:50%;transform:translateY(-50%)}

/* carta / envelope */
.carta-sec{max-width:560px}
.envelope{position:relative;display:block;width:100%;max-width:380px;aspect-ratio:3/2;margin:0 auto}
.envelope span{position:absolute;display:block}
.env-fundo{inset:0;border-radius:12px;background:var(--rosa-300);box-shadow:0 25px 50px rgba(0,0,0,.4)}
.env-papel{left:16px;right:16px;top:12px;bottom:12px;border-radius:6px;background:var(--creme);z-index:1;transition:transform .7s ease}
.env-papel i{display:block;height:4px;border-radius:4px;background:var(--rosa-200);margin:16px auto 0;width:66%}
.env-papel i+i{margin-top:12px;width:50%}
.env-frente{inset:0;border-radius:12px;background:var(--rosa-400);z-index:2;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.env-aba{left:0;top:0;width:100%;height:55%;background:var(--rosa-500);z-index:3;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease}
.env-selo{left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--vinho-700);box-shadow:0 6px 14px rgba(0,0,0,.4);z-index:4;color:var(--rosa-200);display:flex!important;align-items:center;justify-content:center;font-size:1.25rem;transition:opacity .5s ease}
.envelope.aberta .env-aba{transform:rotateX(180deg);z-index:1}
.envelope.aberta .env-papel{transform:translateY(-28%);transition-delay:.5s}
.envelope.aberta .env-selo{opacity:0}
.carta-sec.aberta .titulo p{display:none}
.carta-texto{max-height:0;opacity:0;overflow:hidden;transition:max-height 1.2s ease .6s,opacity 1s ease .7s}
.carta-sec.aberta .carta-texto{max-height:2400px;opacity:1}
.carta-texto article{margin-top:2.5rem;background:var(--creme);color:var(--vinho-800);border-radius:18px;padding:26px;box-shadow:0 25px 50px rgba(0,0,0,.4)}
.carta-texto p{font-family:var(--display);font-size:1.15rem;line-height:2;white-space:pre-line}
@media(min-width:640px){.carta-texto article{padding:36px}.carta-texto p{font-size:1.25rem}}

/* contador */
.contador{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(min-width:640px){.contador{grid-template-columns:repeat(6,1fr)}}
.contador .caixa{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:16px;padding:16px 4px;text-align:center}
.contador .num{font-family:var(--display);font-size:1.9rem;color:var(--rosa-100);font-variant-numeric:tabular-nums}
.contador .rot{font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ouro);margin-top:2px}
.total-dias{text-align:center;margin-top:1.5rem;font-family:var(--script);font-weight:600;font-size:2rem;color:var(--rosa-200)}
.msg-contador{max-width:560px;margin:0 auto;text-align:center;font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.7;padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:rgba(255,245,238,.9)}

/* vídeo */
.sec-video{max-width:760px}
video{width:100%;border-radius:24px;background:#000;border:1px solid rgba(255,255,255,.1);box-shadow:0 25px 50px rgba(0,0,0,.4)}

/* final */
#final{max-width:680px;margin:0 auto;min-height:90vh;min-height:90dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:90px 24px}
#final .grande{font-size:4rem;color:var(--rosa-500)}
#final .frase{font-family:var(--script);font-weight:600;font-size:clamp(2.2rem,8.5vw,3.3rem);line-height:1.25;color:var(--rosa-100);margin-top:2rem}
#final .acoes{margin-top:3rem;display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.botao-texto{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;font-size:.9rem;color:rgba(255,245,238,.7);text-decoration:underline;text-underline-offset:4px}
.botao-texto:active{transform:scale(.95)}

@media(prefers-reduced-motion:reduce){
  .batida,.seta{animation:none!important}
  .coracao{display:none}
  .reveal{transition:none;opacity:1;transform:none}
  html{scroll-behavior:auto}
}
</style>
</head>

<body>
<div id="coracoes" aria-hidden="true"></div>

<main>
  <section id="intro">
    <div class="grande brilho batida" id="introCoracao" aria-hidden="true"></div>
    <h1 id="introFrase"></h1>
    <button type="button" class="botao" id="btnIniciar"></button>
  </section>

  <div id="experiencia" hidden></div>
</main>

<div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button type="button" class="lb-btn" id="lbFechar" aria-label="Fechar">✕</button>
  <button type="button" class="lb-btn" id="lbAnt" aria-label="Foto anterior">‹</button>
  <button type="button" class="lb-btn" id="lbProx" aria-label="Próxima foto">›</button>
  <img id="lbImg" alt="">
  <p class="leg" id="lbLeg"></p>
  <p class="cont" id="lbCont"></p>
</div>

<script>
(function () {
  "use strict";
  var C = CONFIG;

  var HEART = '<svg class="cor" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  var PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><rect width="800" height="600" fill="#4a0d1f"/>' +
    '<path d="M400 400C300 330 280 250 340 230c35-12 60 15 60 30 0-15 25-42 60-30 60 20 40 100-60 170z" fill="#f77296" opacity=".85"/>' +
    '<text x="400" y="470" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#ffc7d4">Sua foto aqui</text></svg>'
  );
  var reduzir = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function $(s) { return document.querySelector(s); }
  function esc(t) {
    return String(t == null ? "" : t).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function imagem(src, alt) {
    return '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy" decoding="async">';
  }
  // Se a foto ainda não existir, mostra um quadro bonito no lugar
  document.addEventListener("error", function (e) {
    var el = e.target;
    if (el && el.tagName === "IMG" && !el.dataset.fb) {
      el.dataset.fb = "1";
      el.src = PLACEHOLDER;
    }
  }, true);

  function titulo(t, s) {
    return '<div class="titulo reveal">' + HEART + "<h2>" + esc(t) + "</h2>" + (s ? "<p>" + esc(s) + "</p>" : "") + "</div>";
  }

  /* ---------------- corações ao fundo ---------------- */
  var camada = $("#coracoes");
  function criarCoracao(imediato) {
    if (reduzir) return;
    var el = document.createElement("div");
    var dur = 10 + Math.random() * 10;
    var tam = 12 + Math.random() * 22;
    el.className = "coracao";
    el.innerHTML = HEART.replace('class="cor" ', "");
    el.style.left = Math.random() * 100 + "%";
    el.style.width = el.style.height = tam + "px";
    el.style.setProperty("--o", (0.25 + Math.random() * 0.35).toFixed(2));
    el.style.animationDuration = dur + "s";
    if (imediato) el.style.animationDelay = -Math.random() * dur + "s";
    el.addEventListener("animationend", function () { el.remove(); });
    camada.appendChild(el);
  }
  for (var i = 0; i < 12; i++) criarCoracao(true);
  setInterval(function () {
    if (!document.hidden && camada.children.length < 22) criarCoracao(false);
  }, 900);

  /* ---------------- abertura ---------------- */
  $("#introCoracao").innerHTML = HEART;
  $("#introFrase").textContent = C.intro.frase;
  $("#btnIniciar").textContent = C.intro.botao;

  /* ---------------- montagem das seções ---------------- */
  function montar() {
    var h = "";

    // 2) declaração
    var d = C.declaracao;
    h += '<section id="declaracao">' +
      '<div class="reveal"><div class="coracao-topo brilho batida">' + HEART + "</div></div>" +
      '<h2 class="reveal">' + esc(d.titulo) + "</h2>" +
      '<div class="linhas">' +
      d.linhas.map(function (l, i) {
        return '<p class="reveal" style="transition-delay:' + i * 250 + 'ms">' + esc(l) + "</p>";
      }).join("") +
      "</div>" +
      '<p class="fecho reveal">' + esc(d.fecho) + "</p>" +
      '<div class="seta" aria-hidden="true">⌄</div>' +
      "</section>";

    // 3) história
    var hs = C.historia;
    h += '<section class="secao">' + titulo(hs.titulo, hs.subtitulo) + '<ol class="linha-tempo">' +
      hs.itens.map(function (it) {
        return '<li><span class="ponto">' + HEART + "</span>" +
          '<article class="cartao reveal">' + imagem(it.foto, it.titulo) +
          '<div class="texto">' + (it.data ? '<p class="data">' + esc(it.data) + "</p>" : "") +
          "<h3>" + esc(it.titulo) + '</h3><p class="leg">' + esc(it.legenda) + "</p></div></article></li>";
      }).join("") + "</ol></section>";

    // 4) galeria
    var g = C.galeria;
    h += '<section class="secao">' + titulo(g.titulo, g.subtitulo) + '<div class="galeria">' +
      g.fotos.map(function (f, i) {
        return '<div class="reveal"><button type="button" class="foto" data-i="' + i + '" aria-label="Ampliar foto ' + (i + 1) + '">' +
          imagem(f.src, f.legenda || "Foto nossa") + "</button></div>";
      }).join("") + "</div></section>";

    // 5) carta
    var c = C.carta;
    h += '<section class="secao carta-sec" id="cartaSec">' + titulo(c.titulo, c.instrucao) +
      '<div class="reveal"><button type="button" class="envelope" id="envelope" aria-expanded="false" aria-label="Abrir carta">' +
      '<span class="env-fundo"></span><span class="env-papel"><i></i><i></i></span>' +
      '<span class="env-frente"></span><span class="env-aba"></span><span class="env-selo">' + HEART + "</span></button></div>" +
      '<div class="carta-texto"><article><p>' + esc(c.texto) + "</p></article></div></section>";

    // 6) contador
    h += '<section class="secao" style="max-width:760px">' + titulo(C.contador.titulo) +
      '<div class="reveal" id="contador"></div></section>';

    // 7) vídeo (só aparece se tiver arquivo)
    var v = C.video;
    if (v.src && v.src.trim()) {
      h += '<section class="secao sec-video">' + titulo(v.titulo, v.subtitulo) +
        '<div class="reveal"><video controls playsinline preload="metadata"' +
        (v.capa ? ' poster="' + esc(v.capa) + '"' : "") + '><source src="' + esc(v.src) + '">' +
        "Seu navegador não conseguiu reproduzir este vídeo.</video></div></section>";
    }

    // 8) final
    var f = C.final;
    var tel = String(f.telefone || "").replace(/\D/g, "");
    var zap = (tel ? "https://wa.me/" + tel : "https://wa.me/") + "?text=" + encodeURIComponent(f.mensagemWhatsApp);
    h += '<section id="final"><div class="reveal"><div class="grande brilho batida">' + HEART + "</div></div>" +
      '<p class="frase reveal" style="transition-delay:200ms">' + esc(f.frase) + "</p>" +
      '<div class="acoes reveal" style="transition-delay:400ms">' +
      '<a class="botao" href="' + esc(zap) + '" target="_blank" rel="noopener noreferrer">' + esc(f.botaoWhatsApp) + "</a>" +
      '<button type="button" class="botao-texto" id="btnVoltar">↑ ' + esc(f.botaoVoltar) + "</button></div></section>";

    $("#experiencia").innerHTML = h;
  }

  /* ---------------- aparecer ao rolar ---------------- */
  function observar() {
    var itens = document.querySelectorAll("#experiencia .reveal");
    if (!("IntersectionObserver" in window)) {
      itens.forEach(function (el) { el.classList.add("visivel"); });
      return;
    }
    var io = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add("visivel"); io.unobserve(e.target); }
      });
    }, { threshold: 0.12 });
    itens.forEach(function (el) { io.observe(el); });
  }

  /* ---------------- carta ---------------- */
  function ligarCarta() {
    var env = $("#envelope"), sec = $("#cartaSec");
    env.addEventListener("click", function () {
      var aberta = env.classList.toggle("aberta");
      sec.classList.toggle("aberta", aberta);
      env.setAttribute("aria-expanded", aberta ? "true" : "false");
      env.setAttribute("aria-label", aberta ? "Fechar carta" : "Abrir carta");
    });
  }

  /* ---------------- galeria ampliada ---------------- */
  var lb = $("#lightbox"), atual = 0, toqueX = null, fotos = C.galeria.fotos;
  function mostrar(i) {
    atual = (i + fotos.length) % fotos.length;
    var img = $("#lbImg");
    img.dataset.fb = "";
    img.src = fotos[atual].src;
    img.alt = fotos[atual].legenda || "Foto nossa";
    $("#lbLeg").textContent = fotos[atual].legenda || "";
    $("#lbCont").textContent = (atual + 1) + " / " + fotos.length;
  }
  function abrir(i) {
    mostrar(i);
    lb.hidden = false;
    document.body.style.overflow = "hidden";
  }
  function fechar() {
    lb.hidden = true;
    document.body.style.overflow = "";
  }
  function ligarGaleria() {
    document.querySelectorAll(".foto").forEach(function (b) {
      b.addEventListener("click", function () { abrir(Number(b.dataset.i)); });
    });
  }
  $("#lbFechar").addEventListener("click", fechar);
  $("#lbAnt").addEventListener("click", function (e) { e.stopPropagation(); mostrar(atual - 1); });
  $("#lbProx").addEventListener("click", function (e) { e.stopPropagation(); mostrar(atual + 1); });
  lb.addEventListener("click", function (e) { if (e.target === lb) fechar(); });
  lb.addEventListener("touchstart", function (e) { toqueX = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener("touchend", function (e) {
    if (toqueX === null) return;
    var dif = e.changedTouches[0].clientX - toqueX;
    toqueX = null;
    if (dif > 50) mostrar(atual - 1);
    else if (dif < -50) mostrar(atual + 1);
  }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (lb.hidden) return;
    if (e.key === "Escape") fechar();
    if (e.key === "ArrowLeft") mostrar(atual - 1);
    if (e.key === "ArrowRight") mostrar(atual + 1);
  });

  /* ---------------- contador ---------------- */
  function calcular(ini, agora) {
    var anos = agora.getFullYear() - ini.getFullYear();
    var meses = agora.getMonth() - ini.getMonth();
    var dias = agora.getDate() - ini.getDate();
    var horas = agora.getHours() - ini.getHours();
    var min = agora.getMinutes() - ini.getMinutes();
    var seg = agora.getSeconds() - ini.getSeconds();
    if (seg < 0) { seg += 60; min--; }
    if (min < 0) { min += 60; horas--; }
    if (horas < 0) { horas += 24; dias--; }
    if (dias < 0) { dias += new Date(agora.getFullYear(), agora.getMonth(), 0).getDate(); meses--; }
    if (meses < 0) { meses += 12; anos--; }
    return {
      anos: anos, meses: meses, dias: dias, horas: horas, min: min, seg: seg,
      total: Math.floor((agora - ini) / 86400000)
    };
  }
  function ligarContador() {
    var alvo = $("#contador");
    var texto = String(C.contador.dataInicio || "").trim();
    var ini = null;
    if (texto) {
      ini = new Date(texto.indexOf("T") > -1 ? texto : texto + "T00:00:00");
      if (isNaN(ini.getTime())) ini = null;
    }
    function mensagem() {
      alvo.innerHTML = '<p class="msg-contador">' + esc(C.contador.mensagemSemData) + "</p>";
    }
    if (!ini || ini > new Date()) { mensagem(); return; }
    function rotulo(n, um, varios) { return n === 1 ? um : varios; }
    function atualizar() {
      var t = calcular(ini, new Date());
      var cx = [
        [t.anos, rotulo(t.anos, "ano", "anos")],
        [t.meses, rotulo(t.meses, "mês", "meses")],
        [t.dias, rotulo(t.dias, "dia", "dias")],
        [t.horas, rotulo(t.horas, "hora", "horas")],
        [t.min, "min"],
        [t.seg, "seg"]
      ];
      alvo.innerHTML = '<div class="contador">' + cx.map(function (c) {
        return '<div class="caixa"><div class="num">' + c[0] + '</div><div class="rot">' + c[1] + "</div></div>";
      }).join("") + '</div><p class="total-dias">Já são ' + t.total + " dias de nós ❤️</p>";
    }
    atualizar();
    setInterval(atualizar, 1000);
  }

  /* ---------------- iniciar ---------------- */
  var iniciou = false;
  $("#btnIniciar").addEventListener("click", function () {
    if (iniciou) return;
    iniciou = true;
    montar();
    ligarCarta();
    ligarGaleria();
    ligarContador();
    var intro = $("#intro");
    intro.classList.add("saindo");
    setTimeout(function () {
      intro.hidden = true;
      $("#experiencia").hidden = false;
      $("#experiencia").style.animation = "entrar 1.2s ease both";
      window.scrollTo(0, 0);
      observar();
      $("#btnVoltar").addEventListener("click", function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }, 500);
  });
})();
</script>
</body>
</html>
